name: Deploy Juice Shop to EKS lab

on:
  push:
    branches:
      - feat/eks-lab

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      AWS_ACCOUNT_ID: "369086592537"
      ECR_REPOSITORY: juice-shop-lab
      EKS_CLUSTER_NAME: juice-shop-lab
      AWS_ROLE_ARN: arn:aws:iam::369086592537:role/juice-shop-github-actions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and push image
        run: |
          image="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy Juice Shop
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/juice-shop.yaml \
            | kubectl apply -f -
          kubectl rollout status deployment/juice-shop --timeout=180s